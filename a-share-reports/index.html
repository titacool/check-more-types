026-04-15/1225107480.PDF", "kind": "年报"}];
const q = document.getElementById("q");
const body = document.getElementById("rows");
let filter = "全部";
function show() {
  const query = q.value.trim().toLowerCase();
  const list = REPORTS.filter((r) => {
    if (filter === "未披露") { if (r.kind !== "招股说明书") return false; }
    else if (filter !== "全部" && !r.industries.split("、").includes(filter)) return false;
    if (!query) return true;
    return r.code.includes(query) || r.name.toLowerCase().includes(query) || r.sub.toLowerCase().includes(query);
  });
  body.replaceChildren(...list.map((r) => {
    const tr = document.createElement("tr");
    const link = document.createElement("a");
    link.href = r.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = r.kind === "年报" ? "打开年报" : "打开招股书";
    [r.code, r.name, r.sub, r.date].forEach((text) => {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    });
    const td = document.createElement("td");
    td.appendChild(link);
    tr.appendChild(td);
    return tr;
  }));
}
document.querySelectorAll("button[data-filter]").forEach((button) => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    document.querySelectorAll("button[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
    show();
  });
});
q.addEventListener("input", show);
show();
</script>
